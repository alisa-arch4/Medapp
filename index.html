<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedApp — Tu asistente de estudio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #09090f;
    --surf:    #111118;
    --surf2:   #17171f;
    --border:  #1e1e2c;
    --border2: #28283a;
    --text:    #ddd8f0;
    --muted:   #605c7a;
    --faint:   #16162a;
    --accent:  #7c3aed;
    --accentL: #c4b5fd;
    --red:     #f87171;
    --orange:  #fb923c;
    --green:   #4ade80;
    --yellow:  #fbbf24;
    --blue:    #60a5fa;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }

  /* NAV */
  #nav { display:flex; align-items:center; gap:4px; height:52px; padding:0 16px; background:var(--surf); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; }
  #nav-title { font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:700; color:var(--accentL); margin-right:10px; letter-spacing:-0.01em; }
  .nav-btn { padding:5px 13px; border-radius:6px; border:none; cursor:pointer; font-size:13px; font-weight:500; background:transparent; color:var(--muted); transition:all .15s; }
  .nav-btn.active { background:#2a1f4a; color:var(--accentL); }
  #add-btn { margin-left:auto; padding:7px 16px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; }
  #alert-badge { font-size:11px; color:var(--red); font-weight:700; margin-right:6px; }

  /* MAIN */
  #main { max-width:880px; margin:0 auto; padding:24px 14px 60px; }

  /* VIEWS */
  .view { display:none; }
  .view.active { display:block; }

  /* CARDS */
  .card { background:var(--surf); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:12px; }
  .card-accent { border-left-width:3px; }

  /* STATS ROW */
  #stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .stat-box { background:var(--surf); border:1px solid var(--border); border-radius:10px; padding:14px 10px; text-align:center; }
  .stat-num { font-size:28px; font-weight:700; }
  .stat-lbl { font-size:11px; color:var(--muted); margin-top:2px; }

  /* URGENCY BADGE */
  .ubadge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; }

  /* TASK ITEM */
  .task-item { border-left-width:3px; position:relative; }
  .task-title { font-size:14px; font-weight:600; margin-bottom:6px; }
  .task-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); }
  .task-plan { background:var(--faint); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .task-plan-title { font-size:11px; color:var(--accentL); font-weight:700; margin-bottom:6px; }
  .session-chips { display:flex; gap:5px; flex-wrap:wrap; }
  .session-chip { font-size:10px; padding:2px 7px; border-radius:4px; background:var(--border2); color:var(--accentL); }
  .task-actions { display:flex; gap:6px; margin-top:12px; }
  .btn-done { padding:5px 12px; border-radius:6px; border:1px solid #4ade8044; background:#4ade8011; color:var(--green); font-size:11px; cursor:pointer; font-weight:600; }
  .btn-del  { padding:5px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:11px; cursor:pointer; }
  .task-notes { font-size:12px; color:var(--muted); margin-top:8px; }
  .done-item { opacity:.4; }
  .done-item .task-title { text-decoration:line-through; }
  .section-lbl { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin:20px 0 10px; }

  /* WEEKLY */
  #week-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  #week-nav button { padding:5px 13px; border-radius:6px; border:1px solid var(--border); background:var(--surf2); color:var(--text); cursor:pointer; font-size:12px; }
  #week-label { font-size:13px; font-weight:600; color:var(--accentL); }
  #week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .day-col { background:var(--surf); border:1px solid var(--border); border-radius:10px; padding:8px 6px; min-height:110px; }
  .day-col.today { border-color:var(--accent); background:#2a1f4a22; }
  .day-col.urgent { border-color:#f8717144; }
  .day-name { font-size:9px; font-weight:700; text-transform:uppercase; color:var(--muted); margin-bottom:3px; }
  .day-num  { font-size:18px; font-weight:700; margin-bottom:6px; }
  .day-col.today .day-name, .day-col.today .day-num { color:var(--accentL); }
  .day-event { font-size:9px; padding:3px 5px; border-radius:4px; margin-bottom:3px; font-weight:700; line-height:1.3; }
  .day-session { font-size:9px; padding:2px 5px; border-radius:4px; margin-bottom:3px; background:var(--faint); color:var(--muted); }
  #week-hours-bar { background:var(--faint); border-radius:8px; padding:9px 13px; margin-bottom:14px; font-size:12px; color:var(--accentL); }

  /* LEITNER */
  #box-row { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:18px; }
  .box-card { border:1px solid var(--border); border-radius:10px; padding:12px 8px; text-align:center; background:var(--surf); }
  .box-name { font-size:10px; font-weight:700; margin-bottom:3px; }
  .box-count { font-size:22px; font-weight:700; color:var(--text); }
  .box-interval { font-size:9px; color:var(--muted); margin-top:2px; }
  .box-due { font-size:9px; font-weight:700; margin-top:5px; padding:1px 6px; border-radius:10px; display:inline-block; }

  /* FLASHCARD */
  #fc-wrap { background:var(--surf); border:1px solid #2a1f4a; border-radius:16px; padding:36px 24px; text-align:center; min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; margin-bottom:18px; transition:border-color .2s; }
  #fc-wrap:hover { border-color:var(--accent); }
  #fc-box-tag { font-size:11px; font-weight:700; padding:2px 10px; border-radius:20px; margin-bottom:12px; display:inline-block; }
  #fc-front { font-size:16px; font-weight:500; line-height:1.6; }
  #fc-divider { width:80%; height:1px; background:var(--border); margin:14px 0; }
  #fc-back { font-size:14px; color:var(--accentL); line-height:1.6; }
  #fc-hint { font-size:11px; color:var(--border2); margin-top:14px; }
  #fc-btns { display:flex; gap:12px; }
  #fc-btns button { flex:1; padding:13px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer; }
  #btn-wrong { background:#dc262622; color:var(--red); border:1px solid #dc262644; }
  #btn-right { background:#16a34a22; color:var(--green); border:1px solid #16a34a44; }
  #fc-progress-wrap { margin-bottom:16px; }
  #fc-prog-bar { height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
  #fc-prog-fill { height:100%; background:var(--accent); border-radius:3px; transition:width .3s; }
  #fc-counter { font-size:12px; color:var(--muted); text-align:right; margin-top:4px; }
  #fc-done { text-align:center; padding:50px 20px; }

  /* IMPORT */
  #import-textarea { width:100%; min-height:150px; background:var(--bg); border:1px solid var(--border2); border-radius:8px; color:var(--text); font-size:13px; padding:12px; resize:vertical; font-family:inherit; line-height:1.6; outline:none; }
  .import-controls { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .import-controls select, .import-controls input { background:var(--bg); border:1px solid var(--border2); border-radius:7px; color:var(--text); font-size:12px; padding:7px 10px; outline:none; font-family:inherit; }
  .btn-primary { padding:8px 18px; border-radius:8px; border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-ghost   { padding:8px 18px; border-radius:8px; border:1px solid var(--border2); background:transparent; color:var(--accentL); font-size:13px; font-weight:600; cursor:pointer; }
  .preview-card { border-left:3px solid var(--accent); position:relative; }
  .preview-front { font-size:13px; font-weight:600; margin-bottom:7px; padding-right:24px; }
  .preview-back  { font-size:12px; color:var(--accentL); }
  .preview-del { position:absolute; top:12px; right:12px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; }
  .add-all-btn { width:100%; padding:13px; border-radius:8px; border:none; background:#16a34a; color:#fff; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }
  .hint-box { background:var(--faint); border-radius:8px; padding:10px 13px; font-size:12px; color:var(--accentL); margin-top:10px; }

  /* VOICE BTN */
  .voice-btn { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--border2); background:var(--surf2); color:var(--accentL); font-size:12px; cursor:pointer; font-weight:600; transition:all .15s; }
  .voice-btn.recording { background:#7c3aed22; border-color:var(--accent); animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 #7c3aed44} 50%{box-shadow:0 0 0 6px #7c3aed00} }
  .mic-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .mic-dot.recording { background:var(--red); }

  /* MODAL */
  #modal-overlay { display:none; position:fixed; inset:0; background:#00000099; z-index:100; align-items:center; justify-content:center; padding:14px; }
  #modal-overlay.open { display:flex; }
  #modal { background:var(--surf); border:1px solid var(--border2); border-radius:14px; padding:22px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
  #modal h2 { font-family:'Space Grotesk',sans-serif; font-size:16px; color:var(--accentL); margin-bottom:18px; }
  .form-lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:5px; display:block; }
  .form-inp { width:100%; background:var(--bg); border:1px solid var(--border2); border-radius:7px; color:var(--text); font-size:13px; padding:9px 11px; outline:none; font-family:inherit; margin-bottom:13px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  #form-hours-hint { background:var(--faint); border-radius:8px; padding:9px 12px; font-size:12px; color:var(--accentL); margin-bottom:14px; }
  #modal-close { float:right; background:none; border:none; color:var(--muted); font-size:22px; cursor:pointer; }

  /* TOAST */
  #toast { position:fixed; bottom:20px; right:16px; background:var(--surf); border:1px solid var(--border2); border-radius:10px; padding:10px 16px; font-size:13px; color:var(--text); opacity:0; transform:translateY(10px); transition:all .25s; pointer-events:none; z-index:200; max-width:300px; }
  #toast.show { opacity:1; transform:translateY(0); }

  /* ALERT PANEL */
  #alert-panel { background:#f8717111; border:1px solid #f8717133; border-radius:10px; padding:13px 16px; margin-bottom:16px; display:none; }
  #alert-panel.show { display:block; }
  #alert-panel-title { font-size:12px; font-weight:700; color:var(--red); margin-bottom:8px; }
  .alert-item { font-size:12px; color:var(--text); padding:3px 0; }

  /* RESPONSIVE */
  @media(max-width:600px) {
    #stats-row { grid-template-columns:repeat(2,1fr); }
    #box-row { grid-template-columns:repeat(3,1fr); }
    #week-grid { grid-template-columns:repeat(4,1fr); }
    .form-row { grid-template-columns:1fr; }
  }
  @media(max-width:400px) {
    #week-grid { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <span id="nav-title">◈ MedApp</span>
  <button class="nav-btn active" onclick="switchTab('planner')">Planner</button>
  <button class="nav-btn" onclick="switchTab('week')">Semana</button>
  <button class="nav-btn" onclick="switchTab('leitner')">Leitner</button>
  <button class="nav-btn" onclick="switchTab('import')">Importar</button>
  <span id="alert-badge" style="display:none"></span>
  <button id="add-btn" onclick="openModal()">＋ Nueva tarea</button>
</nav>

<div id="main">

  <!-- ALERT PANEL -->
  <div id="alert-panel">
    <div id="alert-panel-title">⚠ Atención requerida</div>
    <div id="alert-items"></div>
  </div>

  <!-- ── PLANNER VIEW ── -->
  <div class="view active" id="view-planner">
    <div id="stats-row">
      <div class="stat-box"><div class="stat-num" id="stat-total" style="color:var(--accentL)">0</div><div class="stat-lbl">Total</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-done"  style="color:var(--green)">0</div><div class="stat-lbl">Completadas</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-over"  style="color:var(--red)">0</div><div class="stat-lbl">Vencidas</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-near"  style="color:var(--orange)">0</div><div class="stat-lbl">Próximas 3d</div></div>
    </div>
    <div id="task-list"></div>
  </div>

  <!-- ── WEEK VIEW ── -->
  <div class="view" id="view-week">
    <div id="week-nav">
      <button onclick="shiftWeek(-1)">← Anterior</button>
      <span id="week-label"></span>
      <button onclick="shiftWeek(1)">Siguiente →</button>
    </div>
    <div id="week-hours-bar"></div>
    <div id="week-grid"></div>
  </div>

  <!-- ── LEITNER VIEW ── -->
  <div class="view" id="view-leitner">
    <div id="box-row"></div>
    <div id="leitner-content"></div>
  </div>

  <!-- ── IMPORT VIEW ── -->
  <div class="view" id="view-import">
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--accentL);margin-bottom:10px">Importar apuntes con IA</div>
      <div style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
        <button class="voice-btn" id="voice-import-btn" onclick="toggleVoiceImport()">
          <span class="mic-dot" id="voice-import-dot"></span> Dictar apuntes
        </button>
        <span id="voice-import-status" style="font-size:11px;color:var(--muted)"></span>
      </div>
      <textarea id="import-textarea" placeholder="Pega o dicta tus apuntes aquí. La IA los lee y genera preguntas de estudio..."></textarea>
      <div class="import-controls">
        <label style="font-size:12px;color:var(--muted)">Preguntas:</label>
        <select id="import-count">
          <option>5</option><option selected>8</option><option>10</option><option>15</option><option>20</option>
        </select>
        <button class="btn-primary" id="import-btn" onclick="generateCards()">✦ Generar preguntas</button>
        <div id="import-loading" style="display:none;font-size:12px;color:var(--muted)">Analizando apuntes...</div>
      </div>
      <div class="hint-box" id="import-hint" style="display:none"></div>
    </div>
    <div id="preview-list"></div>
    <div id="manual-section">
      <div class="section-lbl">Crear tarjeta manual</div>
      <div class="card">
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button class="voice-btn" id="voice-card-btn" onclick="toggleVoiceCard()">
            <span class="mic-dot" id="voice-card-dot"></span> Dictar
          </button>
          <span id="voice-card-status" style="font-size:11px;color:var(--muted)"></span>
        </div>
        <input class="form-inp" id="manual-front" placeholder="Pregunta / frente" style="margin-bottom:8px"/>
        <textarea class="form-inp" id="manual-back" placeholder="Respuesta / reverso" style="min-height:70px;resize:vertical;margin-bottom:10px"></textarea>
        <button class="btn-primary" onclick="addManualCard()">+ Agregar tarjeta</button>
      </div>
    </div>
  </div>

</div><!-- /main -->

<!-- MODAL: nueva tarea -->
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close" onclick="closeModal()">×</button>
    <h2>Nueva tarea</h2>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;">
      <button class="voice-btn" id="voice-task-btn" onclick="toggleVoiceTask()">
        <span class="mic-dot" id="voice-task-dot"></span> Dictar tarea
      </button>
      <span id="voice-task-status" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <label class="form-lbl">Título</label>
    <input class="form-inp" id="f-title" placeholder="Ej: Parcial de Bioquímica – Metabolismo"/>
    <div class="form-row">
      <div>
        <label class="form-lbl">Materia</label>
        <select class="form-inp" id="f-subject">
          <option>Anatomía</option><option>Histología</option><option>Embriología</option>
          <option>Bioquímica</option><option>Biología Celular</option><option>Microbiología</option>
          <option>Fisiología</option><option>Otra</option>
        </select>
      </div>
      <div>
        <label class="form-lbl">Tipo</label>
        <select class="form-inp" id="f-type">
          <option value="exam">Examen</option>
          <option value="task">Entrega</option>
          <option value="study">Sesión de estudio</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div>
        <label class="form-lbl">Fecha límite</label>
        <input class="form-inp" type="date" id="f-deadline"/>
      </div>
      <div>
        <label class="form-lbl">Dificultad</label>
        <select class="form-inp" id="f-difficulty">
          <option value="1">Fácil</option>
          <option value="2" selected>Normal</option>
          <option value="3">Difícil</option>
          <option value="4">Muy difícil</option>
        </select>
      </div>
    </div>
    <div id="form-hours-hint"></div>
    <label class="form-lbl">Notas (opcional)</label>
    <textarea class="form-inp" id="f-notes" placeholder="Temas, indicaciones..." style="min-height:65px;resize:vertical"></textarea>
    <button class="btn-primary" style="width:100%;padding:12px;font-size:14px" onclick="submitTask()">Agregar tarea</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const SUBJ_COLORS = {
  "Anatomía":"#f97316","Histología":"#a855f7","Embriología":"#06b6d4",
  "Bioquímica":"#22c55e","Biología Celular":"#3b82f6","Microbiología":"#ef4444",
  "Fisiología":"#eab308","Otra":"#6b7280"
};
const TYPE_ICONS = { exam:"⚡", task:"📋", study:"📖" };
const TYPE_LBL   = { exam:"Examen", task:"Entrega", study:"Sesión de estudio" };
const DIFF_LBL   = { 1:"Fácil", 2:"Normal", 3:"Difícil", 4:"Muy difícil" };
const DIFF_HOURS = { 1:2, 2:4, 3:8, 4:14 };
const BOX_COLORS = ["","#ef4444","#f97316","#eab308","#22c55e","#3b82f6"];
const BOX_NAMES  = ["","Caja 1","Caja 2","Caja 3","Caja 4","Caja 5"];
const BOX_INT    = [0,0,1,3,7,14];
const DAYS_ES    = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const MONTHS_ES  = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

// ═══════════════════════════════════════════════════════
//  STATE & STORAGE
// ═══════════════════════════════════════════════════════
let tasks = JSON.parse(localStorage.getItem("medapp_tasks")||"[]");
let cards = JSON.parse(localStorage.getItem("medapp_cards")||"[]");
let weekOffset = 0;
let sessionDue = [];
let sessionIdx = 0;
let sessionRevealed = false;
let sessionStats = {ok:0,fail:0};

function saveTasks(){ localStorage.setItem("medapp_tasks", JSON.stringify(tasks)); }
function saveCards(){ localStorage.setItem("medapp_cards", JSON.stringify(cards)); }

// ═══════════════════════════════════════════════════════
//  DATE UTILS
// ═══════════════════════════════════════════════════════
function todayStr(){ return new Date().toISOString().slice(0,10); }
function parseD(s){ return new Date(s+"T00:00:00"); }
function diffD(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDate(s){ const d=parseD(s); return `${d.getDate()} ${MONTHS_ES[d.getMonth()]}`; }
function weekStartOf(s){ const d=parseD(s); d.setDate(d.getDate()-d.getDay()); return d.toISOString().slice(0,10); }

// ═══════════════════════════════════════════════════════
//  STUDY PLAN
// ═══════════════════════════════════════════════════════
function suggestSessions(task){
  const days = diffD(todayStr(), task.deadline);
  if(days <= 0) return [];
  const totalH = DIFF_HOURS[task.difficulty]||4;
  const n = Math.ceil(totalH/2);
  const interval = Math.max(1, Math.floor(days/n));
  const res = [];
  for(let i=0;i<n&&i<days;i++) res.push(addD(todayStr(), i*interval+1));
  return res;
}

function urgency(t){
  const d = diffD(todayStr(), t.deadline);
  if(d<0) return 9999;
  return (t.difficulty*2) / Math.max(d+0.5, 0.5);
}

// ═══════════════════════════════════════════════════════
//  URGENCY BADGE HTML
// ═══════════════════════════════════════════════════════
function ubadge(task){
  const d = diffD(todayStr(), task.deadline);
  let col, lbl;
  if(d<0){col="#f87171";lbl=`${Math.abs(d)}d atrasado`;}
  else if(d===0){col="#f87171";lbl="Hoy";}
  else if(d<=2){col="#fb923c";lbl=`En ${d}d`;}
  else if(d<=5){col="#fbbf24";lbl=`En ${d}d`;}
  else{col="#4ade80";lbl=`En ${d}d`;}
  return `<span class="ubadge" style="background:${col}22;color:${col};border:1px solid ${col}44">${lbl}</span>`;
}

// ═══════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  event.target.classList.add('active');
  if(tab==='planner') renderPlanner();
  if(tab==='week')    renderWeek();
  if(tab==='leitner') renderLeitner();
}

// ═══════════════════════════════════════════════════════
//  ALERTS
// ═══════════════════════════════════════════════════════
function renderAlerts(){
  const today = todayStr();
  const overdue = tasks.filter(t=>!t.done && diffD(today,t.deadline)<0);
  const near    = tasks.filter(t=>!t.done && diffD(today,t.deadline)>=0 && diffD(today,t.deadline)<=2);
  const badge   = document.getElementById('alert-badge');
  const panel   = document.getElementById('alert-panel');
  const items   = document.getElementById('alert-items');
  const total   = overdue.length + near.length;
  if(total===0){ badge.style.display='none'; panel.classList.remove('show'); return; }
  badge.style.display='inline';
  badge.textContent = `⚠ ${total}`;
  panel.classList.add('show');
  items.innerHTML = [
    ...overdue.map(t=>`<div class="alert-item">🔴 <strong>${t.title}</strong> — venció hace ${Math.abs(diffD(today,t.deadline))}d</div>`),
    ...near.map(t=>`<div class="alert-item">🟠 <strong>${t.title}</strong> — vence ${diffD(today,t.deadline)===0?'hoy':'en '+diffD(today,t.deadline)+'d'}</div>`)
  ].join('');
}

// ═══════════════════════════════════════════════════════
//  PLANNER RENDER
// ═══════════════════════════════════════════════════════
function renderPlanner(){
  const today = todayStr();
  const pending = tasks.filter(t=>!t.done).sort((a,b)=>urgency(b)-urgency(a));
  const done    = tasks.filter(t=>t.done);

  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-done').textContent  = done.length;
  document.getElementById('stat-over').textContent  = tasks.filter(t=>!t.done&&diffD(today,t.deadline)<0).length;
  document.getElementById('stat-near').textContent  = tasks.filter(t=>!t.done&&diffD(today,t.deadline)>=0&&diffD(today,t.deadline)<=3).length;

  let html = '';
  if(pending.length===0 && done.length===0){
    html = `<div style="text-align:center;padding:60px 20px;color:var(--muted)"><div style="font-size:32px;margin-bottom:10px">📭</div>No hay tareas. Agrega la primera con el botón ＋</div>`;
  }

  pending.forEach(t=>{
    const col = SUBJ_COLORS[t.subject]||'#6b7280';
    const sessions = suggestSessions(t);
    const totalH = DIFF_HOURS[t.difficulty];
    const chips = sessions.slice(0,5).map(d=>`<span class="session-chip">${fmtDate(d)}</span>`).join('');
    const more = sessions.length>5?`<span style="font-size:10px;color:var(--muted)">+${sessions.length-5} más</span>`:'';
    html += `
    <div class="card card-accent task-item" style="border-left-color:${col}" id="task-${t.id}">
      <div class="task-title">${TYPE_ICONS[t.type]} ${t.title}</div>
      <div class="task-meta">
        <span style="width:8px;height:8px;border-radius:50%;background:${col};display:inline-block;flex-shrink:0"></span>
        <span>${t.subject}</span>
        <span>·</span><span>${TYPE_LBL[t.type]}</span>
        <span>·</span><span>${DIFF_LBL[t.difficulty]}</span>
        ${ubadge(t)}
      </div>
      ${sessions.length>0?`
      <div class="task-plan">
        <div class="task-plan-title">📅 Plan sugerido — ${totalH}h en ${sessions.length} sesiones de 2h</div>
        <div class="session-chips">${chips}${more}</div>
      </div>`:''}
      ${t.notes?`<div class="task-notes">${t.notes}</div>`:''}
      <div class="task-actions">
        <button class="btn-done" onclick="completeTask('${t.id}')">✓ Listo</button>
        <button class="btn-del"  onclick="deleteTask('${t.id}')">Borrar</button>
      </div>
    </div>`;
  });

  if(done.length>0){
    html += `<div class="section-lbl">Completadas (${done.length})</div>`;
    done.forEach(t=>{
      const col = SUBJ_COLORS[t.subject]||'#6b7280';
      html += `
      <div class="card done-item" style="border-left:3px solid ${col}44">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <span style="width:6px;height:6px;border-radius:50%;background:${col};display:inline-block;margin-right:7px"></span>
            <span class="task-title" style="display:inline">${t.title}</span>
            <span style="font-size:11px;color:var(--muted);margin-left:6px">${t.subject}</span>
          </div>
          <button class="btn-del" onclick="deleteTask('${t.id}')">×</button>
        </div>
      </div>`;
    });
  }

  document.getElementById('task-list').innerHTML = html;
  renderAlerts();
}

function completeTask(id){
  tasks = tasks.map(t=>t.id===id?{...t,done:true}:t);
  saveTasks(); renderPlanner(); toast("¡Tarea completada! ✓");
}
function deleteTask(id){
  tasks = tasks.filter(t=>t.id!==id);
  saveTasks(); renderPlanner();
}

// ═══════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════
function openModal(){
  const d = addD(todayStr(), 7);
  document.getElementById('f-deadline').value = d;
  document.getElementById('f-title').value = '';
  document.getElementById('f-notes').value = '';
  updateHoursHint();
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

document.getElementById('f-difficulty').addEventListener('change', updateHoursHint);
document.getElementById('f-deadline').addEventListener('change', updateHoursHint);
function updateHoursHint(){
  const diff = parseInt(document.getElementById('f-difficulty').value)||2;
  const dl   = document.getElementById('f-deadline').value;
  const days = dl ? diffD(todayStr(), dl) : 7;
  const h    = DIFF_HOURS[diff];
  const sess = Math.ceil(h/2);
  document.getElementById('form-hours-hint').innerHTML =
    `✦ La app distribuirá aprox. <strong>${h}h</strong> de estudio en ${Math.max(days,0)} días disponibles (${sess} sesiones de 2h)`;
}

function submitTask(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){ toast("Escribe un título primero"); return; }
  const t = {
    id: crypto.randomUUID(),
    title,
    subject:    document.getElementById('f-subject').value,
    type:       document.getElementById('f-type').value,
    deadline:   document.getElementById('f-deadline').value,
    difficulty: parseInt(document.getElementById('f-difficulty').value),
    notes:      document.getElementById('f-notes').value.trim(),
    done: false,
    createdAt: todayStr()
  };
  tasks.push(t);
  saveTasks(); closeModal(); renderPlanner(); toast("Tarea agregada ✓");
}

// ═══════════════════════════════════════════════════════
//  WEEK VIEW
// ═══════════════════════════════════════════════════════
function shiftWeek(n){ weekOffset+=n; renderWeek(); }

function renderWeek(){
  const base = weekStartOf(todayStr());
  const ws   = addD(base, weekOffset*7);
  const today= todayStr();
  const days = Array.from({length:7},(_,i)=>addD(ws,i));

  document.getElementById('week-label').innerHTML =
    `${fmtDate(ws)} – ${fmtDate(addD(ws,6))}${ws===base?'<span style="margin-left:8px;font-size:11px;color:var(--accent)"> esta semana</span>':''}`;

  // compute sessions per day
  let totalH = 0;
  const dayData = days.map(day=>{
    const deadlines = tasks.filter(t=>!t.done && t.deadline===day);
    const sessions  = tasks.filter(t=>!t.done)
      .flatMap(t=>suggestSessions(t).map(d=>({date:d,item:t})))
      .filter(s=>s.date===day);
    totalH += sessions.length*2;
    return {day,deadlines,sessions};
  });

  document.getElementById('week-hours-bar').innerHTML =
    `✦ Esta semana: <strong>${totalH}h</strong> de estudio distribuidas por la app`;

  const grid = document.getElementById('week-grid');
  grid.innerHTML = dayData.map(({day,deadlines,sessions})=>{
    const d = parseD(day);
    const isToday = day===today;
    const hasUrgent = deadlines.some(t=>diffD(today,t.deadline)<=1);
    const cls = isToday?'today':hasUrgent?'urgent':'';
    const events = deadlines.map(t=>{
      const col=SUBJ_COLORS[t.subject]||'#6b7280';
      const lbl=t.title.length>14?t.title.slice(0,12)+'…':t.title;
      return `<div class="day-event" style="background:${col}22;color:${col}">${TYPE_ICONS[t.type]} ${lbl}</div>`;
    }).join('');
    const sess = sessions.slice(0,3).map(s=>{
      const name=s.item.subject.split(' ')[0];
      return `<div class="day-session">📖 ${name} 2h</div>`;
    }).join('');
    return `<div class="day-col ${cls}">
      <div class="day-name">${DAYS_ES[d.getDay()]}</div>
      <div class="day-num">${d.getDate()}</div>
      ${events}${sess}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
//  LEITNER RENDER
// ═══════════════════════════════════════════════════════
function renderLeitner(){
  const today = todayStr();
  sessionDue = cards.filter(c=>{
    if(c.box===0) return false;
    return c.nextReview <= today;
  });

  // Box summary
  let boxHtml = '';
  for(let b=1;b<=5;b++){
    const inBox = cards.filter(c=>c.box===b);
    const due   = inBox.filter(c=>c.nextReview<=today);
    const col   = BOX_COLORS[b];
    boxHtml += `<div class="box-card" style="${due.length>0?`border-color:${col}55;background:${col}0a`:''}">
      <div class="box-name" style="color:${col}">${BOX_NAMES[b]}</div>
      <div class="box-count">${inBox.length}</div>
      <div class="box-interval">${b===1?'Todos los días':b===2?'Cada 2 días':b===3?'Cada 4 días':b===4?'Cada semana':'Cada 2 sem'}</div>
      ${due.length>0?`<div class="box-due" style="background:${col}22;color:${col}">${due.length} pend.</div>`:''}
    </div>`;
  }
  document.getElementById('box-row').innerHTML = boxHtml;

  // Session
  const content = document.getElementById('leitner-content');
  if(cards.length===0){
    content.innerHTML = `<div style="text-align:center;padding:50px 20px;color:var(--muted)">
      <div style="font-size:28px;margin-bottom:10px">🃏</div>
      No hay tarjetas. Ve a <strong>Importar</strong> para generar con IA o crear manualmente.
    </div>`;
    return;
  }
  if(sessionDue.length===0){
    content.innerHTML = `<div style="text-align:center;padding:50px 20px" id="fc-done">
      <div style="font-size:36px;margin-bottom:10px">🎉</div>
      <div style="font-size:16px;font-weight:600;color:var(--green);margin-bottom:8px">¡Sin pendientes hoy!</div>
      <div style="font-size:13px;color:var(--muted)">Vuelve mañana. Tienes ${cards.length} tarjetas en el sistema.</div>
    </div>`;
    return;
  }
  sessionIdx = 0; sessionRevealed = false; sessionStats = {ok:0,fail:0};
  renderFC();
}

function renderFC(){
  const content = document.getElementById('leitner-content');
  if(sessionIdx >= sessionDue.length){
    const pct = Math.round(sessionStats.ok/(sessionStats.ok+sessionStats.fail)*100)||0;
    content.innerHTML = `<div style="text-align:center;padding:50px 20px">
      <div style="font-size:36px;margin-bottom:10px">✅</div>
      <div style="font-size:16px;font-weight:600;margin-bottom:16px">Sesión completada</div>
      <div style="display:flex;gap:24px;justify-content:center;margin-bottom:20px">
        <div><div style="font-size:30px;font-weight:700;color:var(--green)">${sessionStats.ok}</div><div style="font-size:12px;color:var(--muted)">correctas</div></div>
        <div><div style="font-size:30px;font-weight:700;color:var(--red)">${sessionStats.fail}</div><div style="font-size:12px;color:var(--muted)">incorrectas</div></div>
      </div>
      <div style="font-size:14px;color:var(--accentL);margin-bottom:20px">${pct}% de aciertos</div>
      <button class="btn-ghost" onclick="renderLeitner()">Volver al resumen</button>
    </div>`;
    return;
  }
  const card = sessionDue[sessionIdx];
  const col  = BOX_COLORS[card.box];
  const pct  = Math.round((sessionIdx/sessionDue.length)*100);
  content.innerHTML = `
    <div id="fc-progress-wrap">
      <div id="fc-prog-bar"><div id="fc-prog-fill" style="width:${pct}%"></div></div>
      <div id="fc-counter">${sessionIdx+1} / ${sessionDue.length}</div>
    </div>
    <div id="fc-wrap" onclick="revealFC()">
      <span id="fc-box-tag" style="background:${col}22;color:${col};border:1px solid ${col}44">${BOX_NAMES[card.box]}</span>
      <div id="fc-front">${card.front}</div>
      <div id="fc-divider" style="display:none"></div>
      <div id="fc-back" style="display:none">${card.back}</div>
      <div id="fc-hint">Toca para revelar la respuesta</div>
    </div>
    <div id="fc-btns" style="display:none">
      <button id="btn-wrong" onclick="answerFC(false)">✗ No lo sabía → Caja 1</button>
      <button id="btn-right" onclick="answerFC(true)">✓ Lo sabía → ${BOX_NAMES[Math.min(card.box+1,5)]}</button>
    </div>`;
}

function revealFC(){
  if(sessionRevealed) return;
  sessionRevealed = true;
  document.getElementById('fc-divider').style.display='block';
  document.getElementById('fc-back').style.display='block';
  document.getElementById('fc-hint').style.display='none';
  document.getElementById('fc-btns').style.display='flex';
  document.getElementById('fc-wrap').style.cursor='default';
}

function answerFC(correct){
  const card = sessionDue[sessionIdx];
  const newBox = correct ? Math.min(card.box+1,5) : 1;
  const interval = BOX_INT[newBox];
  cards = cards.map(c=>c.id===card.id?{...c, box:newBox, nextReview:addD(todayStr(),interval)}:c);
  saveCards();
  if(correct) sessionStats.ok++; else sessionStats.fail++;
  sessionIdx++;
  sessionRevealed = false;
  renderFC();
}

// ═══════════════════════════════════════════════════════
//  IMPORT / GENERATE CARDS
// ═══════════════════════════════════════════════════════
let previewCards = [];

async function generateCards(){
  const notes = document.getElementById('import-textarea').value.trim();
  if(!notes){ toast("Primero escribe o dicta tus apuntes"); return; }
  const n = document.getElementById('import-count').value;
  document.getElementById('import-btn').disabled = true;
  document.getElementById('import-loading').style.display='inline';
  document.getElementById('import-hint').style.display='none';
  document.getElementById('preview-list').innerHTML='';
  previewCards = [];

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:`Eres un tutor de ciencias médicas. El usuario te dará apuntes en español y debes generar exactamente ${n} tarjetas de estudio tipo flashcard de alta dificultad académica. Responde ÚNICAMENTE con JSON válido sin ningún texto adicional ni comillas de código: {"cards":[{"front":"pregunta","back":"respuesta concisa"},...]}`,
        messages:[{role:"user",content:notes}]
      })
    });
    const data = await res.json();
    const raw  = (data.content||[]).map(b=>b.text||'').join('');
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    previewCards = parsed.cards||[];
    renderPreview();
    document.getElementById('import-hint').style.display='block';
    document.getElementById('import-hint').textContent=`✦ ${previewCards.length} preguntas generadas — revisa y confirma`;
  } catch(e){
    toast("Error generando preguntas. Revisa tu conexión.");
  }
  document.getElementById('import-btn').disabled=false;
  document.getElementById('import-loading').style.display='none';
}

function renderPreview(){
  const list = document.getElementById('preview-list');
  if(previewCards.length===0){ list.innerHTML=''; return; }
  let html = '';
  previewCards.forEach((c,i)=>{
    html += `<div class="card preview-card">
      <button class="preview-del" onclick="removePreview(${i})">×</button>
      <div class="preview-front">${c.front}</div>
      <div class="preview-back">${c.back}</div>
    </div>`;
  });
  html += `<button class="add-all-btn" onclick="addAllPreview()">Añadir ${previewCards.length} tarjetas al sistema Leitner →</button>`;
  list.innerHTML = html;
}

function removePreview(i){
  previewCards.splice(i,1);
  renderPreview();
}

function addAllPreview(){
  previewCards.forEach(p=>{
    cards.push({ id:crypto.randomUUID(), front:p.front, back:p.back, box:1, nextReview:todayStr(), source:'ia', history:[] });
  });
  saveCards();
  previewCards=[];
  document.getElementById('preview-list').innerHTML='';
  document.getElementById('import-textarea').value='';
  document.getElementById('import-hint').style.display='none';
  toast(`${cards.length} tarjetas en el sistema ✓`);
}

function addManualCard(){
  const front = document.getElementById('manual-front').value.trim();
  const back  = document.getElementById('manual-back').value.trim();
  if(!front||!back){ toast("Completa pregunta y respuesta"); return; }
  cards.push({ id:crypto.randomUUID(), front, back, box:1, nextReview:todayStr(), source:'manual', history:[] });
  saveCards();
  document.getElementById('manual-front').value='';
  document.getElementById('manual-back').value='';
  toast("Tarjeta añadida a Caja 1 ✓");
}

// ═══════════════════════════════════════════════════════
//  VOICE / SPEECH RECOGNITION
// ═══════════════════════════════════════════════════════
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let activeVoiceTarget = null; // 'task' | 'import' | 'card'

function makeRecog(){
  if(!SpeechRecognition){ toast("Tu navegador no soporta voz. Usa Chrome."); return null; }
  const r = new SpeechRecognition();
  r.lang = 'es-ES';
  r.continuous = true;
  r.interimResults = false;
  return r;
}

function stopVoice(){
  if(recog){ try{recog.stop();}catch(e){} recog=null; }
  setVoiceUI(activeVoiceTarget, false);
  activeVoiceTarget = null;
}

function setVoiceUI(target, on){
  const btnId  = {task:'voice-task-btn', import:'voice-import-btn', card:'voice-card-btn'}[target];
  const dotId  = {task:'voice-task-dot', import:'voice-import-dot', card:'voice-card-dot'}[target];
  const statId = {task:'voice-task-status', import:'voice-import-status', card:'voice-card-status'}[target];
  if(!btnId) return;
  const btn  = document.getElementById(btnId);
  const dot  = document.getElementById(dotId);
  const stat = document.getElementById(statId);
  if(on){ btn.classList.add('recording'); dot.classList.add('recording'); stat.textContent='Escuchando...'; }
  else  { btn.classList.remove('recording'); dot.classList.remove('recording'); stat.textContent=''; }
}

function startVoice(target, onResult){
  if(activeVoiceTarget){ stopVoice(); return; }
  recog = makeRecog();
  if(!recog) return;
  activeVoiceTarget = target;
  setVoiceUI(target, true);
  recog.onresult = (e)=>{
    let txt='';
    for(let i=e.resultIndex;i<e.results.length;i++) txt+=e.results[i][0].transcript;
    onResult(txt);
  };
  recog.onerror = ()=>{ toast("Error de micrófono"); stopVoice(); };
  recog.onend   = ()=>stopVoice();
  recog.start();
}

// Voice: dictar nueva tarea
function toggleVoiceTask(){
  startVoice('task', (txt)=>{
    const cur = document.getElementById('f-title').value;
    document.getElementById('f-title').value = cur ? cur+' '+txt : txt;
  });
}

// Voice: dictar apuntes
function toggleVoiceImport(){
  startVoice('import', (txt)=>{
    const cur = document.getElementById('import-textarea').value;
    document.getElementById('import-textarea').value = cur ? cur+' '+txt : txt;
  });
}

// Voice: dictar tarjeta manual (alterna entre front/back)
let voiceCardField = 'front';
function toggleVoiceCard(){
  startVoice('card', (txt)=>{
    const fld = voiceCardField==='front'?'manual-front':'manual-back';
    const cur = document.getElementById(fld).value;
    document.getElementById(fld).value = cur ? cur+' '+txt : txt;
    voiceCardField = voiceCardField==='front'?'back':'front';
    document.getElementById('voice-card-status').textContent =
      voiceCardField==='front'?'Próximo: pregunta':'Próximo: respuesta';
  });
}

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2800);
}
